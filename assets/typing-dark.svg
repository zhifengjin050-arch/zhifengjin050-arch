<g class="cycle" clip-path="url(#cycle2)"><text x="64" y="56" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#F5EEDB" text-anchor="start">打磨 MCP 工具，让每次执行有边界、可追踪。</text></g>
